# Security headers for every PDFDock response. Included at server level and
# again in each location that sets its own headers (nginx drops inherited
# add_header lines in any block that has its own).
#
# connect-src 'self' is the technical guarantee behind "your files are never
# uploaded": even if a future library update tried to send data elsewhere,
# the browser would refuse. The only place a document can go is this server's
# own /api/pdf2word/.
#
# 'wasm-unsafe-eval' lets the bundled engines (qpdf, OCR, Word to PDF)
# compile their WebAssembly. 'unsafe-eval' is needed by the scanner engine
# (OpenCV.js builds its JavaScript bindings at runtime). The app never shows
# user-supplied HTML, so the practical risk this adds is low; remove it if the
# Scan tool is ever dropped.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; worker-src 'self' blob:; connect-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
