# Which client addresses may use PDF to Word. Edit to match the head-office
# LAN (ask MIS for the subnets), then run: docker compose restart web
#
# Everyone else, including regional and district offices reaching the app
# over the internet, gets "PDF to Word only works on the head-office network
# for now" in the app. All other tools keep working for them.

allow 10.0.0.0/8;
allow 172.16.0.0/12;
allow 192.168.0.0/16;
allow 127.0.0.1;
deny all;
